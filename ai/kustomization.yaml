# Planespotter with its AI features on VKS. The app runs here; its language model is a Private AI
# Services model endpoint and its database a Data Services Manager PostgreSQL, so this namespace
# holds no model server and no database, only the app that uses them. It sits beside the
# buildpacks deployment, in a namespace of its own.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: planespotter-ai
resources:
  - ../kubernetes
  # The api-server's status page checks adsb-sync at adsb-sync:9090, as docker-compose names
  # it; the manifests above give it no Service.
  - adsb-sync-service.yaml
  - db-seed.yaml
# Built from each service's Dockerfile on the ai branch, and pinned by digest so the cluster runs
# exactly the images that were tested. ai/README.md has the build.
images:
  - name: planespotter-api
    newName: ghcr.io/darrylcauldwell/planespotter-ai/api-server
    digest: sha256:4d1759157d98a43a3a253ce0f116406cdb69c7f5db19c361953f385a140a4c9a
  - name: planespotter-frontend
    newName: ghcr.io/darrylcauldwell/planespotter-ai/frontend
    digest: sha256:3e02a33209d8c56fdcb7aae58c248f9d020b40c9e2e3fc814ddfcaeaf9ff05e8
  - name: planespotter-adsb-sync
    newName: ghcr.io/darrylcauldwell/planespotter-ai/adsb-sync
    digest: sha256:e253e04eb393f9e9849081621465ba59a032454deb5e844d830e5ec226550d59
  # Postgres with the aircraft data and its import script; here only the seed job runs it.
  - name: planespotter-db
    newName: ghcr.io/darrylcauldwell/planespotter-ai/db-install
    digest: sha256:a1803d1d5a243052036ec221df6722bfe6e49e696d3c5a42a370b5f0b43f9eab
patches:
  - path: services.yaml
    target: {kind: ConfigMap, name: api-server-config}
  - path: api-server.yaml
    target: {kind: Deployment, name: api-server}
  # The database is Data Services Manager's. The manifests' own Postgres goes, with its volume
  # and settings, and so does api-server-secret: a database password kept in git.
  - target: {kind: Deployment, name: postgres}
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: postgres
  - target: {kind: Service, name: postgres}
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: postgres
  - target: {kind: PersistentVolumeClaim, name: postgres-pvc}
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: postgres-pvc
  - target: {kind: ConfigMap, name: postgres-config}
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: postgres-config
  - target: {kind: Secret, name: postgres-secret}
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: postgres-secret
  - target: {kind: Secret, name: api-server-secret}
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: api-server-secret
  # No ingress controller. The frontend stays a ClusterIP Service, reached with kubectl
  # port-forward: the lab has no LoadBalancer address to spare. The status page checks the
  # frontend at frontend:8080, docker-compose's port, so the Service offers it beside 80.
  - target:
      kind: Ingress
      name: frontend-ingress
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: frontend-ingress
  - target:
      kind: Service
      name: frontend
    patch: |-
      - op: add
        path: /spec/ports/-
        value: {name: app, port: 8080, targetPort: 8080}
  # Anonymous OpenSky access is rate limited, and the upstream 30-second poll exhausts it: the
  # positions then expire and every "flying now" question finds nothing. These are
  # docker-compose's values, chosen for the same reason; a position can be 35 minutes old.
  - target:
      kind: ConfigMap
      name: adsb-sync-config
    patch: |-
      - op: replace
        path: /data/POLL_INTERVAL
        value: "1800"
      - op: replace
        path: /data/REDIS_TTL
        value: "2100"
      - op: add
        path: /data/MAX_BACKOFF
        value: "1800"
  # The valkey image starts as root, which the "restricted" Pod Security Standard refuses.
  - target:
      kind: Namespace
    patch: |-
      - op: add
        path: /metadata/labels/pod-security.kubernetes.io~1enforce
        value: baseline
