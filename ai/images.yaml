# One kpack Image per service, each built from its own folder on the ai branch with the
# platform team's builder, into image repositories of its own so these builds never replace the
# buildpacks deployment's. The build settings point pip and npm at the platform's package mirror.
apiVersion: kpack.io/v1alpha2
kind: Image
metadata:
  name: api-server
spec:
  tag: ghcr.io/darrylcauldwell/planespotter-ai/api-server
  serviceAccountName: builder
  builder:
    kind: ClusterBuilder
    name: python-node
  source:
    git:
      url: https://github.com/darrylcauldwell/planespotter
      revision: ai
    subPath: api-server
  build:
    env:
      - name: PIP_INDEX_URL
        value: http://packages.mirror.svc/pypi/simple
      - name: PIP_TRUSTED_HOST
        value: packages.mirror.svc
---
apiVersion: kpack.io/v1alpha2
kind: Image
metadata:
  name: frontend
spec:
  tag: ghcr.io/darrylcauldwell/planespotter-ai/frontend
  serviceAccountName: builder
  builder:
    kind: ClusterBuilder
    name: python-node
  source:
    git:
      url: https://github.com/darrylcauldwell/planespotter
      revision: ai
    subPath: frontend
  build:
    env:
      - name: PIP_INDEX_URL
        value: http://packages.mirror.svc/pypi/simple
      - name: PIP_TRUSTED_HOST
        value: packages.mirror.svc
      - name: NPM_CONFIG_REGISTRY
        value: http://packages.mirror.svc/npm/
---
apiVersion: kpack.io/v1alpha2
kind: Image
metadata:
  name: adsb-sync
spec:
  tag: ghcr.io/darrylcauldwell/planespotter-ai/adsb-sync
  serviceAccountName: builder
  builder:
    kind: ClusterBuilder
    name: python-node
  source:
    git:
      url: https://github.com/darrylcauldwell/planespotter
      revision: ai
    subPath: adsb-sync
  build:
    env:
      - name: PIP_INDEX_URL
        value: http://packages.mirror.svc/pypi/simple
      - name: PIP_TRUSTED_HOST
        value: packages.mirror.svc
