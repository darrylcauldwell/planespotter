# Both use the registry Secret "ghcr", created in this namespace outside git: kpack pushes the
# images with it, and the pods pull them with it whether or not the packages are public.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: builder
secrets:
  - name: ghcr
imagePullSecrets:
  - name: ghcr
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
imagePullSecrets:
  - name: ghcr
